name: Verify ANDROIDTUI

on:
  push:
    branches: [main]
    tags: ["androidtui-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-overlay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare pinned OpenTUI source
        run: bun run prepare:upstream
      - name: Verify patches and overlay
        run: bun run verify
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/androidtui-v')
        run: |
          VERSION="${GITHUB_REF_NAME#androidtui-v}"
          PINNED="$(bun -e "console.log(require('./androidtui.json').upstream.tag.slice(1))")"
          test "$VERSION" = "$PINNED" || {
            echo "Release tag $VERSION does not match pinned upstream $PINNED"
            exit 1
          }

  native-android-arm64:
    name: Native Android ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build inside Termux
        run: bash ci/build-on-runner.sh
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: opentui-android-arm64-${{ github.sha }}
          path: |
            .work/native-artifacts/libopentui.so
            .work/native-artifacts/SHA256SUMS
            .work/native-artifacts/build-manifest.json
          if-no-files-found: error
