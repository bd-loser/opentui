name: ANDROIDTUI Release

on:
  push:
    branches: [main]
    tags: ["androidtui-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all packages to npm after build and verification
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: androidtui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-overlay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned OpenTUI source
        run: node scripts/prepare.mjs
      - name: Verify patches and overlay
        run: node scripts/verify.mjs
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/androidtui-v')
        run: |
          VERSION="${GITHUB_REF_NAME#androidtui-v}"
          PINNED="$(node -p "require('./androidtui.json').releaseVersion")"
          test "$VERSION" = "$PINNED" || {
            echo "Release tag $VERSION does not match pinned upstream $PINNED"
            exit 1
          }

  native-android-arm64:
    name: Native Android ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build inside Termux
        run: bash ci/build-on-runner.sh
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: androidtui-release-${{ github.sha }}
          path: |
            .work/native-artifacts/libopentui.so
            .work/native-artifacts/SHA256SUMS
            .work/native-artifacts/build-manifest.json
            .work/native-artifacts/packages/*.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages
    needs: [verify-overlay, native-android-arm64]
    # Publishing is deliberately manual. First build on main, download the
    # artifact, and run the renderer smoke test on a real Termux device.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: androidtui-release-${{ github.sha }}
          path: release
      - name: Verify release bundle
        run: |
          cd release
          sha256sum -c SHA256SUMS
          test "$(find packages -name '*.tgz' -type f | wc -l)" -eq 8
      - name: Preflight npm versions
        run: |
          VERSION="$(node -p "require('./release/build-manifest.json').version")"
          for package_name in core-android-arm64 core react solid keymap qrcode three ssh; do
            if npm view "@androidtui/$package_name@$VERSION" version >/dev/null 2>&1; then
              echo "::error::@androidtui/$package_name@$VERSION already exists"
              exit 1
            fi
          done
      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.XINCLI_NPM_SECRET }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          VERSION="$(node -p "require('./release/build-manifest.json').version")"
          UPSTREAM="$(node -p "require('./release/build-manifest.json').upstreamVersion")"
          # Only a stable version equal to upstream is a promotion, and only a
          # promotion may move `latest`. The other two shapes are both
          # deliberately non-default: a -future.N preview, and a stable version
          # below upstream (a test publish burning a spare number). Hardcoding
          # `future` here is what stranded `latest` at 0.5.3 while 0.5.4 and
          # 0.5.5 shipped past it.
          case "$VERSION" in
            *-future.*)  DIST_TAG=future ;;
            "$UPSTREAM") DIST_TAG=latest ;;
            *)           DIST_TAG=future ;;
          esac
          echo "Publishing $VERSION (upstream $UPSTREAM) to dist-tag $DIST_TAG"
          publish() {
            npm publish "release/packages/androidtui-$1-$VERSION.tgz" \
              --access public --tag "$DIST_TAG"
          }
          publish core-android-arm64
          publish core
          publish react
          publish solid
          publish keymap
          publish qrcode
          publish three
          publish ssh
